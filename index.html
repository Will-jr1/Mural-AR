<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR Mural Guide</title>

  <!-- A-Frame v1.5.0 & MindAR Image Tracking v1.2.5 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- HUD OVERLAY (Acima do Canvas WebGL) -->
  <div id="hud-container">
    
    <!-- Topo: Status de Ancoragem e Escala -->
    <header class="hud-top">
      <div id="tracking-badge" class="status-badge status-searching">
        <span class="status-dot"></span>
        <span id="tracking-text">Procurando alvo...</span>
      </div>

      <div class="scale-controls">
        <button id="btn-scale-down" class="hud-btn icon-btn" aria-label="Diminuir Escala">−</button>
        <span id="scale-display" class="scale-readout">100%</span>
        <button id="btn-scale-up" class="hud-btn icon-btn" aria-label="Aumentar Escala">+</button>
      </div>
    </header>

    <!-- Base: Controles de Camadas, Opacidade e Piscar Guia -->
    <footer class="hud-bottom">
      
      <!-- Botão Hold-to-Hide / Piscar Guia -->
      <div class="quick-actions">
        <button id="btn-peek" class="hud-btn peek-btn">
          SEGURE PARA OCULTAR GUIA (PEEK)
        </button>
      </div>

      <!-- Slider de Opacidade Global -->
      <div class="opacity-control">
        <label for="opacity-slider">
          <span>OPACIDADE DO GABARITO</span>
          <strong id="opacity-value">85%</strong>
        </label>
        <input 
          type="range" 
          id="opacity-slider" 
          min="0" 
          max="100" 
          value="85" 
          step="1" 
        />
      </div>

      <!-- Seletores de Camadas (Layers) -->
      <div class="layer-toggles">
        <button class="hud-btn layer-btn active" data-layer="layer-wireframe">
          <span class="layer-index">[1]</span> Esqueleto
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-fill">
          <span class="layer-index">[2]</span> Preenchimento
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-details">
          <span class="layer-index">[3]</span> Detalhes
        </button>
      </div>

    </footer>
  </div>

  <!-- CENA WEBAR (A-Frame + MindAR) -->
  <!-- 
    CONFIGURAÇÃO ANTI-JITTER (Estabilização de Mão):
    filterMinCF: 0.0001 (Reduz tremedeira quando a mão está quase parada)
    filterBeta: 0.001 (Suaviza transições rápidas de movimento)
    missTolerance: 5 (Mantém a projeção ativa por 5 frames caso a lata passe na frente)
  -->
  <a-scene
    mindar-image="imageTargetSrc: ./assets/targets.mind; filterMinCF: 0.0001; filterBeta: 0.001; warmupTolerance: 5; missTolerance: 5; uiScanning: no; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights: false, alpha: true, antialias: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <!-- Preload das Texturas PNG -->
    <a-assets timeout="10000">
      <img id="tex-wireframe" src="./assets/layer-wireframe.png" crossorigin="anonymous" />
      <img id="tex-fill" src="./assets/layer-fill.png" crossorigin="anonymous" />
      <img id="tex-details" src="./assets/layer-details.png" crossorigin="anonymous" />
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Âncora do Marcador Físico (Índice 0 do targets.mind) -->
    <a-entity id="marker-anchor" mindar-image-target="targetIndex: 0">
      
      <!-- 
        ======================================================================
        OFFSET E ESCALA DO MURAL (AJUSTE DE CAMPO AQUI):
        A unidade "1" equivale à largura física da folha do marcador impresso.
        Exemplo abaixo: position="1.5 0.8 0"
        Se o marcador A4 estiver colado no canto inferior esquerdo, o centro da
        arte será projetado 1.5x a largura do marcador para a direita (X = 1.5)
        e 0.8x para cima (Y = 0.8).
        ======================================================================
      -->
      <a-entity id="mural-rig" position="1.5 0.8 0" scale="2.5 2.5 1">
        
        <!-- 
          PROPORÇÃO DOS PLANOS (width / height):
          Ajuste width e height de acordo com o aspect ratio do seu PNG (ex: 16:9 -> width="1.77" height="1").
          O eixo Z possui incremento de 0.001 entre camadas para impedir Z-fighting.
          O shader: flat garante que as cores não sofram interferência de luz 3D.
        -->

        <!-- Layer 1: Esqueleto / Wireframe -->
        <a-plane
          id="layer-wireframe"
          position="0 0 0.001"
          width="1.6"
          height="1.0"
          material="src: #tex-wireframe; transparent: true; opacity: 0.85; alphaTest: 0.01; shader: flat; depthWrite: false"
        ></a-plane>

        <!-- Layer 2: Preenchimento / Fill -->
        <a-plane
          id="layer-fill"
          position="0 0 0.002"
          width="1.6"
          height="1.0"
          material="src: #tex-fill; transparent: true; opacity: 0.85; alphaTest: 0.01; shader: flat; depthWrite: false"
        ></a-plane>

        <!-- Layer 3: Detalhes / Brilhos e Outlines -->
        <a-plane
          id="layer-details"
          position="0 0 0.003"
          width="1.6"
          height="1.0"
          material="src: #tex-details; transparent: true; opacity: 0.85; alphaTest: 0.01; shader: flat; depthWrite: false"
        ></a-plane>

      </a-entity>
    </a-entity>
  </a-scene>

  <script type="module" src="app.js"></script>
</body>
</html>
