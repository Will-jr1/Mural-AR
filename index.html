<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR Mural Pro — 6DoF & Hard Lock</title>

  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. CÂMERA DE FUNDO (Usada no modo Giroscópio / Hard Lock) -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- 2. CENA 3D A-FRAME + SUPORTE WEBXR (SLAM 6DoF) -->
  <a-scene
    id="main-scene"
    embedded
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    renderer="alpha: true; antialias: true; colorManagement: true; precision: highp;"
    webxr="requiredFeatures: hit-test,local-floor; optionalFeatures: dom-overlay; overlayElement: #hud-container;"
  >
    <a-assets timeout="10000">
      <img id="tex-wireframe" src="./assets/layer-wireframe.png" crossorigin="anonymous" />
      <img id="tex-fill" src="./assets/layer-fill.png" crossorigin="anonymous" />
      <img id="tex-details" src="./assets/layer-details.png" crossorigin="anonymous" />
    </a-assets>

    <!-- Câmera 3D -->
    <a-entity id="camera-rig" position="0 0 0">
      <a-camera
        id="ar-camera"
        position="0 0 0"
        look-controls="magicWindowTrackingEnabled: true; touchEnabled: false; mouseEnabled: false"
      ></a-camera>
    </a-entity>

    <!-- Mira laser no chão/parede quando no Modo WebXR 6DoF -->
    <a-entity id="xr-reticle" visible="false">
      <a-ring color="#00ff66" radius-inner="0.08" radius-outer="0.11" rotation="-90 0 0"></a-ring>
      <a-circle color="#00ff66" radius="0.02" rotation="-90 0 0"></a-circle>
    </a-entity>

    <!-- ÂNCORA 3D DA PAREDE -->
    <a-entity id="wall-anchor" position="0 0 -2.2" rotation="0 0 0">
      <a-entity id="mural-rig" position="0 0 0" rotation="0 0 0" scale="1.5 1.5 1">

        <!-- Grade de Perspectiva 3D -->
        <a-plane
          id="perspective-grid"
          position="0 0 0"
          width="1.65"
          height="1.05"
          material="color: #00ff66; wireframe: true; segmentsWidth: 10; segmentsHeight: 6; opacity: 0.4; transparent: true"
        ></a-plane>

        <!-- Layer 1: Esqueleto -->
        <a-plane
          id="layer-wireframe"
          position="0 0 0.002"
          width="1.6"
          height="1.0"
          material="src: #tex-wireframe; transparent: true; opacity: 0.85; alphaTest: 0.01; shader: flat; side: double; depthWrite: false"
        ></a-plane>

        <!-- Layer 2: Preenchimento -->
        <a-plane
          id="layer-fill"
          position="0 0 0.004"
          width="1.6"
          height="1.0"
          material="src: #tex-fill; transparent: true; opacity: 0.85; alphaTest: 0.01; shader: flat; side: double; depthWrite: false"
        ></a-plane>

        <!-- Layer 3: Detalhes -->
        <a-plane
          id="layer-details"
          position="0 0 0.006"
          width="1.6"
          height="1.0"
          material="src: #tex-details; transparent: true; opacity: 0.85; alphaTest: 0.01; shader: flat; side: double; depthWrite: false"
        ></a-plane>

      </a-entity>
    </a-entity>
  </a-scene>

  <!-- 3. HUD DE CONTROLE -->
  <div id="hud-container">
    <header class="hud-top">
      <div class="top-bar-row">
        <!-- Botão de Trava Absoluta (Mata 100% do Drift do Giroscópio) -->
        <button id="btn-hard-lock" class="hud-btn lock-screen-btn">
          🔓 GIROSCÓPIO LIVRE (TOQUE P/ TRAVAR FIXO)
        </button>

        <div class="top-right-tools">
          <button id="btn-toggle-dpad" class="hud-btn tool-toggle-btn">3D / TILT</button>
          <div class="scale-controls">
            <button id="btn-scale-down" class="hud-btn icon-btn">−</button>
            <span id="scale-display" class="scale-readout">100%</span>
            <button id="btn-scale-up" class="hud-btn icon-btn">+</button>
          </div>
        </div>
      </div>

      <!-- Barra Secundária: WebXR 6DoF (SLAM Real) + Recentralizar -->
      <div class="sub-bar-row">
        <button id="btn-recenter-wall" class="hud-btn sub-btn">
          🎯 Puxar Arte p/ Minha Frente
        </button>
        <button id="btn-start-webxr" class="hud-btn xr-btn" style="display: none;">
          🚀 ATIVAR AR LASER (6DoF)
        </button>
      </div>

      <!-- Gaveta de Perspectiva 3D (Inclinacão da Parede + Posição) -->
      <div id="dpad-panel" class="dpad-drawer hidden">
        <div class="dpad-info">
          <span class="dpad-title">PERSPECTIVA 3D DA PAREDE</span>
          <code id="coords-display" class="coords-readout">Y: 0° | X: 0° | Z: 0°</code>
          
          <div class="tilt-controls">
            <button class="hud-btn tilt-btn" data-ry="-3">◀ Perspectiva Esq</button>
            <button class="hud-btn tilt-btn" data-ry="3">Perspectiva Dir ▶</button>
            <button class="hud-btn tilt-btn" data-rx="-3">▲ Inclinar Cima</button>
            <button class="hud-btn tilt-btn" data-rx="3">▼ Inclinar Baixo</button>
            <button class="hud-btn tilt-btn" data-rz="-1.5">↺ Girar -1.5°</button>
            <button class="hud-btn tilt-btn" data-rz="1.5">↻ Girar +1.5°</button>
          </div>

          <button id="btn-pos-reset" class="hud-btn reset-btn">ZERAR PERSPECTIVA</button>
        </div>

        <div class="dpad-grid">
          <button class="hud-btn dpad-btn up" data-dx="0" data-dy="0.04">▲</button>
          <button class="hud-btn dpad-btn left" data-dx="-0.04" data-dy="0">◀</button>
          <div class="dpad-center-dot"></div>
          <button class="hud-btn dpad-btn right" data-dx="0.04" data-dy="0">▶</button>
          <button class="hud-btn dpad-btn down" data-dx="0" data-dy="-0.04">▼</button>
        </div>
      </div>
    </header>

    <footer class="hud-bottom">
      <div class="quick-actions">
        <button id="btn-toggle-grid" class="hud-btn grid-btn active">
          GRID 3D: ON
        </button>
        <button id="btn-peek" class="hud-btn peek-btn">
          SEGURE P/ OCULTAR (PEEK)
        </button>
      </div>

      <div class="opacity-control">
        <label for="opacity-slider">
          <span>OPACIDADE DO GABARITO</span>
          <strong id="opacity-value">85%</strong>
        </label>
        <input type="range" id="opacity-slider" min="0" max="100" value="85" step="1" />
      </div>

      <div class="layer-toggles">
        <button class="hud-btn layer-btn active" data-layer="layer-wireframe">
          <span class="layer-index">[1]</span> Esqueleto
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-fill">
          <span class="layer-index">[2]</span> Preenchimento
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-details">
          <span class="layer-index">[3]</span> Detalhes
        </button>
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
