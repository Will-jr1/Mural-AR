<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR Mural 6DoF — Three.js + WebXR</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Import Map oficial do Three.js r160 -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <!-- Container onde o Three.js/WebXR vai injetar o Canvas 3D -->
  <div id="webgl-container"></div>

  <!-- HUD que flutua por cima da sessão WebXR (via dom-overlay) -->
  <div id="hud-container">
    <header class="hud-top">
      <div class="top-bar-row">
        <div id="tracking-badge" class="status-badge status-searching">
          <span class="status-dot"></span>
          <span id="tracking-text">Aguardando Sensor 6DoF...</span>
        </div>

        <div class="top-right-tools">
          <button id="btn-toggle-dpad" class="hud-btn tool-toggle-btn">AJUSTE FINO</button>
          <div class="scale-controls">
            <button id="btn-scale-down" class="hud-btn icon-btn">−</button>
            <span id="scale-display" class="scale-readout">100%</span>
            <button id="btn-scale-up" class="hud-btn icon-btn">+</button>
          </div>
        </div>
      </div>

      <!-- Botão Principal para Iniciar o Sensor 6DoF Real (SLAM) -->
      <button id="btn-start-xr" class="hud-btn start-xr-btn">
        🚀 INICIAR RASTREAMENTO 6DoF (PAREDE REAL)
      </button>

      <!-- Gaveta de Ajuste Fino (Offset Local + Inclinação da Parede) -->
      <div id="dpad-panel" class="dpad-drawer hidden">
        <div class="dpad-info">
          <span class="dpad-title">AJUSTE FINO NA PAREDE</span>
          <code id="coords-display" class="coords-readout">Dist Z: 0.00m | Rot: 0°</code>
          
          <div class="tilt-controls">
            <button class="hud-btn tilt-btn" data-ry="-2">◀ Virar Esq</button>
            <button class="hud-btn tilt-btn" data-ry="2">Virar Dir ▶</button>
            <button class="hud-btn tilt-btn" data-rx="-2">▲ Inclinar Cima</button>
            <button class="hud-btn tilt-btn" data-rx="2">▼ Inclinar Baixo</button>
            <button class="hud-btn tilt-btn" data-rz="-1">↺ Girar -1°</button>
            <button class="hud-btn tilt-btn" data-rz="1">↻ Girar +1°</button>
          </div>

          <button id="btn-pos-reset" class="hud-btn reset-btn">ZERAR AJUSTES</button>
        </div>

        <div class="dpad-grid">
          <button class="hud-btn dpad-btn up" data-dx="0" data-dy="0.02">▲</button>
          <button class="hud-btn dpad-btn left" data-dx="-0.02" data-dy="0">◀</button>
          <div class="dpad-center-dot"></div>
          <button class="hud-btn dpad-btn right" data-dx="0.02" data-dy="0">▶</button>
          <button class="hud-btn dpad-btn down" data-dx="0" data-dy="-0.02">▼</button>
        </div>
      </div>
    </header>

    <footer class="hud-bottom">
      <div class="quick-actions">
        <button id="btn-place-wall" class="hud-btn place-btn">
          📌 COLAR ARTE NA MIRA
        </button>
        <button id="btn-peek" class="hud-btn peek-btn">
          SEGURE P/ OCULTAR (PEEK)
        </button>
      </div>

      <div class="opacity-control">
        <label for="opacity-slider">
          <span>OPACIDADE DO GABARITO</span>
          <strong id="opacity-value">85%</strong>
        </label>
        <input type="range" id="opacity-slider" min="0" max="100" value="85" step="1" />
      </div>

      <div class="layer-toggles">
        <button class="hud-btn layer-btn active" data-layer="layer-wireframe">
          <span class="layer-index">[1]</span> Esqueleto
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-fill">
          <span class="layer-index">[2]</span> Preenchimento
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-details">
          <span class="layer-index">[3]</span> Detalhes
        </button>
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
