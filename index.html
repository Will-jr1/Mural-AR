<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR Mural iOS — 6DoF Optical Flow</title>
  <link rel="stylesheet" href="style.css" />

  <!-- Three.js compatível com 100% dos iPhones (Safari / Chrome iOS) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- 1. CÂMERA DO IPHONE AO VIVO NO FUNDO -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- 2. CANVAS 3D DO THREE.JS (ARTE EM PERSPECTIVA E ZOOM) -->
  <div id="webgl-container"></div>

  <!-- 3. CANVAS DE DEBUG DOS PONTOS RASTREADOS NA PAREDE -->
  <canvas id="cv-debug-canvas"></canvas>

  <!-- 4. HUD DE CONTROLE -->
  <div id="hud-container">
    <header class="hud-top">
      <div class="top-bar-row">
        <div id="tracking-badge" class="status-badge status-unlocked">
          <span class="status-dot"></span>
          <span id="tracking-text">Modo Posicionamento Livre</span>
        </div>

        <div class="top-right-tools">
          <button id="btn-toggle-dpad" class="hud-btn tool-toggle-btn">3D / TILT</button>
          <div class="scale-controls">
            <button id="btn-scale-down" class="hud-btn icon-btn">−</button>
            <span id="scale-display" class="scale-readout">1.5m</span>
            <button id="btn-scale-up" class="hud-btn icon-btn">+</button>
          </div>
        </div>
      </div>

      <!-- Botão Principal: Liga o Rastreador Óptico de Parede + Giroscópio no iPhone -->
      <button id="btn-wall-lock" class="hud-btn wall-lock-btn">
        🎯 GRUDAR NA PAREDE (ATIVAR 6DoF ÓPTICO)
      </button>

      <!-- Gaveta de Perspectiva 3D (Inclinação da Parede + Posição) -->
      <div id="dpad-panel" class="dpad-drawer hidden">
        <div class="dpad-info">
          <span class="dpad-title">PERSPECTIVA 3D & DISTÂNCIA</span>
          <code id="coords-display" class="coords-readout">Dist: 1.50m | Pts: 0</code>
          
          <div class="tilt-controls">
            <button class="hud-btn tilt-btn" data-ry="-3">◀ Virar Esq</button>
            <button class="hud-btn tilt-btn" data-ry="3">Virar Dir ▶</button>
            <button class="hud-btn tilt-btn" data-rx="-3">▲ Inclinar Cima</button>
            <button class="hud-btn tilt-btn" data-rx="3">▼ Inclinar Baixo</button>
            <button class="hud-btn tilt-btn" data-rz="-1.5">↺ Girar -1.5°</button>
            <button class="hud-btn tilt-btn" data-rz="1.5">↻ Girar +1.5°</button>
          </div>

          <button id="btn-pos-reset" class="hud-btn reset-btn">CENTRALIZAR ARTE</button>
        </div>

        <div class="dpad-grid">
          <button class="hud-btn dpad-btn up" data-dx="0" data-dy="0.04">▲</button>
          <button class="hud-btn dpad-btn left" data-dx="-0.04" data-dy="0">◀</button>
          <div class="dpad-center-dot"></div>
          <button class="hud-btn dpad-btn right" data-dx="0.04" data-dy="0">▶</button>
          <button class="hud-btn dpad-btn down" data-dx="0" data-dy="-0.04">▼</button>
        </div>
      </div>
    </header>

    <footer class="hud-bottom">
      <div class="quick-actions">
        <button id="btn-freeze-screen" class="hud-btn freeze-btn">
          ❄️ CONGELAR NA TELA (TRIPÉ)
        </button>
        <button id="btn-peek" class="hud-btn peek-btn">
          SEGURE P/ OCULTAR (PEEK)
        </button>
      </div>

      <div class="opacity-control">
        <label for="opacity-slider">
          <span>OPACIDADE DO GABARITO</span>
          <strong id="opacity-value">85%</strong>
        </label>
        <input type="range" id="opacity-slider" min="0" max="100" value="85" step="1" />
      </div>

      <div class="layer-toggles">
        <button class="hud-btn layer-btn active" data-layer="layer-wireframe">
          <span class="layer-index">[1]</span> Esqueleto
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-fill">
          <span class="layer-index">[2]</span> Preenchimento
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-details">
          <span class="layer-index">[3]</span> Detalhes
        </button>
      </div>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
