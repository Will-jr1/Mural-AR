<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>WebAR Mural Guide — Markerless</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 1. FEED DA CÂMERA AO VIVO NO FUNDO -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- 2. PALCO DE PROJEÇÃO DA ARTE (3 CAMADAS EMPILHADAS) -->
  <main id="projection-stage">
    <div id="mural-rig">
      <img id="layer-wireframe" class="mural-layer" src="./assets/layer-wireframe.png" alt="Layer 1 Esqueleto" />
      <img id="layer-fill" class="mural-layer" src="./assets/layer-fill.png" alt="Layer 2 Preenchimento" />
      <img id="layer-details" class="mural-layer" src="./assets/layer-details.png" alt="Layer 3 Detalhes" />
    </div>
  </main>

  <!-- 3. HUD DE CONTROLE -->
  <div id="hud-container">
    <header class="hud-top">
      <div class="top-bar-row">
        <div id="tracking-badge" class="status-badge status-unlocked">
          <span class="status-dot"></span>
          <span id="tracking-text">Modo Ajuste Livre</span>
        </div>

        <div class="top-right-tools">
          <button id="btn-toggle-dpad" class="hud-btn tool-toggle-btn">XY / ROT</button>
          <div class="scale-controls">
            <button id="btn-scale-down" class="hud-btn icon-btn">−</button>
            <span id="scale-display" class="scale-readout">100%</span>
            <button id="btn-scale-up" class="hud-btn icon-btn">+</button>
          </div>
        </div>
      </div>

      <!-- Gaveta D-Pad + Rotação -->
      <div id="dpad-panel" class="dpad-drawer hidden">
        <div class="dpad-info">
          <span class="dpad-title">POSIÇÃO & ROTAÇÃO</span>
          <code id="coords-display" class="coords-readout">X: 0 | Y: 0 | 0°</code>
          <div class="rot-buttons">
            <button id="btn-rot-left" class="hud-btn reset-btn">↺ -1°</button>
            <button id="btn-rot-right" class="hud-btn reset-btn">↻ +1°</button>
          </div>
          <button id="btn-pos-reset" class="hud-btn reset-btn">CENTRALIZAR</button>
        </div>

        <div class="dpad-grid">
          <button class="hud-btn dpad-btn up" data-dx="0" data-dy="-5">▲</button>
          <button class="hud-btn dpad-btn left" data-dx="-5" data-dy="0">◀</button>
          <div class="dpad-center-dot"></div>
          <button class="hud-btn dpad-btn right" data-dx="5" data-dy="0">▶</button>
          <button class="hud-btn dpad-btn down" data-dx="0" data-dy="5">▼</button>
        </div>
      </div>
    </header>

    <footer class="hud-bottom">
      <div class="quick-actions">
        <button id="btn-freeze" class="hud-btn freeze-btn">
          TRAVAR NA TELA (LOCK)
        </button>
        <button id="btn-peek" class="hud-btn peek-btn">
          SEGURE P/ OCULTAR (PEEK)
        </button>
      </div>

      <div class="opacity-control">
        <label for="opacity-slider">
          <span>OPACIDADE DO GABARITO</span>
          <strong id="opacity-value">85%</strong>
        </label>
        <input type="range" id="opacity-slider" min="0" max="100" value="85" step="1" />
      </div>

      <div class="layer-toggles">
        <button class="hud-btn layer-btn active" data-layer="layer-wireframe">
          <span class="layer-index">[1]</span> Esqueleto
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-fill">
          <span class="layer-index">[2]</span> Preenchimento
        </button>
        <button class="hud-btn layer-btn active" data-layer="layer-details">
          <span class="layer-index">[3]</span> Detalhes
        </button>
      </div>
    </footer>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
